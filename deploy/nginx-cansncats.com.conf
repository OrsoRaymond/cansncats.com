# cansncats.com — Cans n Cats podcast site. Static from /var/www/cansncats.com, API on PM2 cansncats-api (127.0.0.1:3006).
# Source: /home/tide/cansncats (github.com/OrsoRaymond/cansncats.com). Redeploy: /home/tide/cansncats/deploy.sh
# Cloudflare proxies the zone (SSL mode Full; self-signed origin cert).

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.cansncats.com;
    ssl_certificate /etc/ssl/cansncats.com/origin.pem;
    ssl_certificate_key /etc/ssl/cansncats.com/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    server_tokens off;
    return 301 https://cansncats.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cansncats.com;
    ssl_certificate /etc/ssl/cansncats.com/origin.pem;
    ssl_certificate_key /etc/ssl/cansncats.com/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    server_tokens off;

    root /var/www/cansncats.com;
    index index.html;
    error_page 404 /404.html;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json application/xml image/svg+xml;

    location /api/ {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Referer $http_referer;
    }

    # Long cache for static assets (CSS/JS URLs carry ?v=<commit>, stamped by deploy.sh).
    location ~* \.(png|webp|jpg|jpeg|ico|svg|css|js)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~* \.woff2$ {
        types { } default_type font/woff2;
        expires 30d;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        types { } default_type application/manifest+json;
        expires 1d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cansncats.com www.cansncats.com;
    return 301 https://cansncats.com$request_uri;
}
